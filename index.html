<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITCONNECT — AI Service Showcase</title>
  <meta name="description" content="아이티커넥트가 AI로 직접 개발해 업무에 활용하는 14개 서비스 소개">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="sr-only">ITCONNECT AI Service Showcase</h1>

  <!-- 1920×1080 고정 캔버스 (화면 크기에 맞춰 자동 스케일) -->
  <div class="stage" id="stage">
    <main class="deck" id="deck" aria-live="polite"></main>

    <div class="chrome" aria-hidden="true">
      <div class="chrome__brand">ITCONNECT</div>
      <div class="chrome__label">AI Service Showcase</div>
      <div class="chrome__counter">
        <span id="now">01</span>
        <span class="chrome__bar"><i id="bar"></i></span>
        <span class="chrome__total" id="total">16</span>
      </div>
    </div>
  </div>

  <div class="blackout" id="blackout"></div>

  <script src="slides-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
